[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "board panel"}
@media (orientation:portrait){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,48%);grid-template-areas:"top" "board" "panel"}}

/* Kopfleiste */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);white-space:nowrap}
@media (max-width:960px){.brand{display:none}}
.phase{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.phase small{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phase b{font-family:var(--display);font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px 3px 4px;white-space:nowrap;cursor:pointer}
.chip .pos{font-family:var(--display);font-size:12px;color:var(--muted);width:12px;text-align:center}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.chip .nm{font-weight:600;font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.chip .vals{font-family:var(--display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.chip .vals .ico{width:10px;height:10px}
.chip.act{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.chip.me .nm{color:var(--fg)}
.iconbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;width:34px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none}

/* Karte */
#board{grid-area:board;position:relative;min-height:0;overflow:hidden;background:var(--bg)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.gridline{stroke:var(--grid);stroke-width:1}
.rlabel{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.3em;fill:var(--line);text-anchor:middle}
.rlabel.off{opacity:.35}
.edge{stroke:var(--edge);stroke-width:3;stroke-linecap:round}
.edge.off{stroke:var(--line);stroke-width:1.5;opacity:.5}
.edge.own{stroke-width:3.5;opacity:.95}
.ecost circle{fill:var(--panel);stroke:var(--edge);stroke-width:1.2}
.ecost text{font-family:var(--display);font-size:11px;font-weight:600;fill:var(--muted);text-anchor:middle}
.city .halo{fill:transparent}
.city .body{fill:var(--panel-2);stroke-width:3}
.city .cname{font-family:var(--body);font-weight:600;font-size:11px;fill:var(--fg);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.city .sl{stroke-width:1.2}
.city .sl.open{fill:var(--bg);stroke:var(--muted)}
.city .sl.lock{fill:none;stroke:var(--line)}
.city.off circle{fill:var(--line)}

/* --- Rohstoffe & Bauen --- */

function buyResources(pid,cart){

function linkPath(p,target){/* kürzeste Leitung vom eigenen Netz zur neuen Stadt – für die Netzlinien auf der Karte */
  if(!p.cities.length)return[];const act=new Set(activeIds()),d={},pv={},done=new Set();
  act.forEach(c=>d[c]=Infinity);p.cities.forEach(c=>d[c]=0);
  for(;;){let u=null,b=Infinity;for(const c of act)if(!done.has(c)&&d[c]<b){b=d[c];u=c}if(u===null||u===target)break;done.add(u);for(const{to,cost}of ADJ[u]){if(act.has(to)&&d[u]+cost<d[to]){d[to]=d[u]+cost;pv[to]=u}}}
  const out=[];let c=target,g=0;while(pv[c]!=null&&g++<200){out.push([pv[c],c].sort().join('|'));c=pv[c]}return out}

  if(!p.cities.length)return null;
  const act=new Set(activeIds()),d={},done=new Set();
  act.forEach(c=>d[c]=Infinity);p.cities.forEach(c=>d[c]=0);
  for(;;){let u=null,b=Infinity;for(const c of act)if(!done.has(c)&&d[c]<b){b=d[c];u=c}if(u===null)break;done.add(u);for(const{to,cost}of ADJ[u]){if(act.has(to)&&d[u]+cost<d[to])d[to]=d[u]+cost}}

}

  const myIsl=R.islands?new Set(p.cities.map(islandOf)):null;
  for(const c of activeIds()){
    const occ=S.owners[c]||[];
    if(occ.includes(p.id))continue;
    const cr=cityRule(c);if(occ.length>=cr.max||occ.length>=cr.costs.length)continue;
    const slot=cr.costs[occ.length];
    let conn=d?d[c]:0,jump=false;
    if(R.japan){
      if(!p.cities.length){if(!starts.has(c))continue}

      else if(!p.jumpUsed&&starts.has(c)&&conn>0&&(!(p.human&&!p.useJump)||conn===Infinity)){conn=0;jump=true}

}

/* --- Bürokratie --- */
function powerOptions(p,nums,pool=p.pool){
  const need={coal:0,oil:0,garbage:0,uranium:0};let h1=0,h2=0,hf=0,cities=0;
  for(const n of nums){const[t,k,c]=PLANTS[n];if(t==='mine')continue;cities+=c+(p.sub===n?1:0);if(FREE(t))continue;if(t==='hybrid')h1+=k;else if(t==='gohybrid')h2+=k;else if(t==='flux')hf+=k;else need[t]+=k}
  if(need.coal>pool.coal||need.oil>pool.oil||need.garbage>pool.garbage||need.uranium>pool.uranium)return null;
  const lc=pool.coal-need.coal,lo=pool.oil-need.oil,lg=pool.garbage-need.garbage;
  const uc=Math.min(h1,lc),ug=Math.min(h2,lg),uo=(h1-uc)+(h2-ug);if(uo>lo)return null;
  const use={...need};use.coal+=uc;use.garbage+=ug;use.oil+=uo;
  if(hf){const rem={coal:lc-uc,oil:lo-uo,garbage:lg-ug,uranium:pool.uranium-need.uranium};let f=hf;for(const r of ['coal','garbage','oil','uranium']){const x=Math.min(f,rem[r]);use[r]+=x;f-=x}if(f>0)return null}
  return{use,cities,powered:Math.min(cities,cityCount(p))};
}
function bestPower(p){
  let best={nums:[],powered:0,used:0};const pl=p.plants;
  for(let m=1;m<(1<<pl.length);m++){
    const nums=pl.filter((_,i)=>m&(1<<i));const o=powerOptions(p,nums);if(!o)continue;
    const used=RES.reduce((s,r)=>s+o.use[r],0);
    if(o.powered>best.powered||(o.powered===best.powered&&used<best.used))best={nums,powered:o.powered,used};
  }
  return best.nums;
}
function roundIncome(p,powered){let inc=PAY[Math.min(powered,20)];if(S.outage)inc=Math.max(0,inc-3*p.cities.length);return inc}
function payout(p,use,powered,nums=[]){
  RES.forEach(r=>p.pool[r]-=use[r]);
  {const sp=st().pl[p.id];sp.burn=sp.burn||{coal:0,oil:0,garbage:0,uranium:0};RES.forEach(r=>sp.burn[r]+=use[r]);sp.powT=sp.powT||{};let left=powered;nums.slice().sort((a,b)=>PLANTS[b][2]-PLANTS[a][2]).forEach(n=>{const c=Math.min(left,PLANTS[n][2]);if(c>0){const t=PLANTS[n][0];sp.powT[t]=(sp.powT[t]||0)+c;left-=c}})}
  const inc=roundIncome(p,powered);p.money+=inc;p.lastPowered=powered;const sp=st().pl[p.id];sp.income+=inc;sp.maxInc=Math.max(sp.maxInc,inc);
  log(p.name+' versorgt '+powered+(powered===1?' Stadt':' Städte')+' und verdient '+inc+' €.',p.id);
}
function applyPower(p,nums){
  const o=powerOptions(p,nums)||{use:{coal:0,oil:0,garbage:0,uranium:0},powered:0};
  payout(p,o.use,o.powered,nums);
}
function startBureau(){
  S.phase='bureau';S.bureauDone=false;if(S.taxAt!=null&&S.round>=S.taxAt){S.taxAt=null;S.players.forEach(p=>{const t=Math.floor(p.money/5);p.money-=t;log(p.name+' zahlt '+t+' € Steuern.',p.id)})}S.outage=!!(MR().india&&(S.builtRound||0)>2*S.n);if(S.outage)log('Stromausfall! '+S.builtRound+' neue Städte in einer Runde sind mehr als doppelt so viele wie Spieler. Jeder zahlt 3 € pro Stadt von seinem Einkommen.');
  S.players.filter(p=>!p.human).forEach(p=>applyPower(p,bestPower(p)));
  if(!S.players.some(p=>p.human))finishBureau();

function finishBureau(){
  st().series.push({r:S.round,m:S.players.map(p=>p.money),c:S.players.map(p=>p.cities.length),p:S.players.map(p=>p.lastPowered)});

function fitMap(){

  UI.vb={x:x0,y:y0,w,h};
  try{const r=svg.getBoundingClientRect();if(!r.width||!r.height)return;
    const tk=document.getElementById('tracker'),rt=document.getElementById('rtag');
    const T=tk&&tk.offsetParent?Math.max(0,tk.getBoundingClientRect().bottom-r.top):0;
    const B=rt&&rt.offsetParent&&rt.textContent?Math.max(0,r.bottom-rt.getBoundingClientRect().top):0;

      const W=sc*r.width,H=sc*r.height,ay=(T+3)+avail/2;

    const W=sc*r.width,H=sc*r.height;

  }catch(_){}
}

const TCACHE=new Map();
function tr(t){
  if(LANG!=='en'||!t||!/[A-Za-zÄÖÜäöüß]/.test(t))return t;
  if(TCACHE.has(t))return TCACHE.get(t);
  let o=t;
  for(const[re,r]of TSR)o=o.replace(re,r);
  for(const[re,r]of TP)o=o.replace(re,r);
  for(const[re,r]of TSR2)o=o.replace(re,r);
  for(const[re,r]of TWR)o=o.replace(re,r);
  o=o.replace(/^You (passes|bids|raises|drops|buys|retires|builds|undoes|does|powers|wins)\b/u,(m,v)=>'You '+({passes:'pass',does:'do',undoes:'undo'}[v]||v.replace(/s$/,''))).replace(/^You (.+) and earns /u,'You $1 and earn ').replace(/^You (.+) and earns /u,'You $1 and earn ').replace(/^You is /u,'You are ').replace(/^You (\w+)s\b(?= )/u,(m,v)=>['wins','buys'].includes(v+'s')?'You '+v:m);
  if(TCACHE.size>4000)TCACHE.clear();TCACHE.set(t,o);return o;
}
const ORIG=new WeakMap(),ORIGA=new WeakMap(),TATTR=['aria-label','title'];
function trNode(n){
  if(LANG!=='en')return;
  if(n.nodeType===3){const p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName))return;const v=n.nodeValue,o=tr(v);if(o!==v){if(!ORIG.has(n))ORIG.set(n,v);n.nodeValue=o}return}
  if(n.nodeType!==1||/^(SCRIPT|STYLE)$/.test(n.nodeName))return;
  const els=[n,...n.querySelectorAll('[aria-label],[title]')];
  for(const el of els)for(const a of TATTR){const v=el.getAttribute&&el.getAttribute(a);if(v){const o=tr(v);if(o!==v){const m=ORIGA.get(el)||{};if(!(a in m))m[a]=v;ORIGA.set(el,m);el.setAttribute(a,o)}}}
  const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while((t=w.nextNode()))trNode(t);
}
function restoreAll(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let t;while((t=w.nextNode()))if(ORIG.has(t)){t.nodeValue=ORIG.get(t);ORIG.delete(t)}
  document.querySelectorAll('[aria-label],[title]').forEach(el=>{const m=ORIGA.get(el);if(m){for(const a in m)el.setAttribute(a,m[a]);ORIGA.delete(el)}});
}

const LX=(de,en)=>LANG==='en'?en:de;
function fuelTotals(h){

}
function powMix(h){const t={};let tot=0;h.forEach(g=>{const pt=meOf(g).powT||{};Object.entries(pt).forEach(([k,v])=>{t[k]=(t[k]||0)+v;tot+=v})});return{t,tot}}
const TLAB=()=>LANG==='en'?{coal:'Coal',oil:'Oil',garbage:'Garbage',uranium:'Uranium',eco:'Eco',fusion:'Fusion',hybrid:'Coal/oil',gohybrid:'Garbage/oil'}:{coal:'Kohle',oil:'Öl',garbage:'Müll',uranium:'Uran',eco:'Öko',fusion:'Fusion',hybrid:'Kohle/Öl',gohybrid:'Müll/Öl'};
function insightsCard(h,auAll){

    const top=Object.entries(M.t).sort((a,b)=>b[1]-a[1])[0];if(top&&top[1]/M.tot>=.35)out.push({s:14+top[1]/M.tot*25,ic:'mix',big:Math.round(top[1]/M.tot*100)+' %',t:LX(`deiner versorgten Städte liefen über ${RL[top[0]]}`,`of the cities you powered ran on ${RL[top[0]].toLowerCase()}`)})}
  if(!isNaN(T.mI)&&T.mI>0)out.push({s:15+Math.max(0,T.mI-25)*.8,ic:'coin',good:T.mI<30,big:Math.round(T.mI)+' %',t:LX('deiner Einnahmen gehen im Schnitt wieder für Brennstoff drauf','of your income goes straight back into fuel')});
  let bought=0,burned=0;h.forEach(g=>{const m=meOf(g);if(!m.burn)return;RES.forEach(k=>{bought+=((m.res||{})[k]||[0])[0];burned+=m.burn[k]||0})});
  if(bought>=10){const u=Math.max(0,bought-burned)/bought;if(u>=.08)out.push({s:12+u*80,ic:'stock',good:false,big:Math.round(u*100)+' %',t:LX('der gekauften Brennstoffe hast du nie verbrannt, sie lagen bei Spielende noch im Lager','of the fuel you bought was never burned and was still in storage at the end')})}
  const wr=h.filter(g=>meOf(g).place===1).length/h.length;

  RES.forEach(k=>{const gs=h.filter(g=>main(g)===k);if(gs.length<2)return;const w=gs.filter(g=>meOf(g).place===1).length/gs.length;if(Math.abs(w-wr)>=.15)out.push({s:20+Math.abs(w-wr)*60,ic:'win',good:w>wr,big:Math.round(w*100)+' %',t:LX(`Siegquote, wenn ${RL[k]} dein Hauptbrennstoff ist (insgesamt ${Math.round(wr*100)} %)`,`win rate when ${RL[k].toLowerCase()} is your main fuel (overall ${Math.round(wr*100)} %)`)})});
  const pr=RES.map(k=>{let u=0,c=0;h.forEach(g=>{const x=(meOf(g).res||{})[k];if(x){u+=x[0];c+=x[1]}});return{k,p:u>=4?c/u:null}}).filter(x=>x.p!=null).sort((a,b)=>b.p-a.p);
  if(pr.length>=2&&pr[0].p/pr[pr.length-1].p>=1.8){const a=pr[0],b=pr[pr.length-1];out.push({s:13,ic:'fuel',big:fmt1(a.p)+' €',t:LX(`zahlst du im Schnitt je ${RL[a.k]}-Einheit, für ${RL[b.k]} nur ${fmt1(b.p)} €`,`is your average price per unit of ${RL[a.k].toLowerCase()}, ${RL[b.k].toLowerCase()} costs you only ${fmt1(b.p)} €`)})}

}
