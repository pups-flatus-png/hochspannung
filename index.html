<body>
<style>
/* Leitwarte: die Karte ist ein Netz-Schaltplan (links/oben), daneben das Bedienpult mit Phase, Markt und eigenem Betrieb */
:root{
  color-scheme:dark;
  --bg:#0b1014; --panel:#121a20; --panel-2:#19232b; --line:#26333d; --edge:#3a4b58; --grid:#141e25;
  --fg:#e3eaee; --muted:#8495a1; --accent:#f2b33d; --accent-ink:#1d1405;
  --coal:#8b5e3c; --oil:#4a515d; --garbage:#c9b236; --uranium:#e0483d; --eco:#58b86a;
  --good:#58b86a; --bad:#e0483d;
  --display:'Saira Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "board panel"}
@media (orientation:portrait){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,48%);grid-template-areas:"top" "board" "panel"}}

/* Kopfleiste */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
@media (max-width:960px){.brand{display:none}}
.phase{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}
.phase small{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phase b{font-family:var(--display);font-weight:600;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px 3px 4px;white-space:nowrap;cursor:pointer}
.chip .pos{font-family:var(--display);font-size:12px;color:var(--muted);width:12px;text-align:center}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.chip .nm{font-weight:600;font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis}
.chip .vals{font-family:var(--display);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.chip .vals .ico{width:10px;height:10px}
.chip.act{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.chip.me .nm{color:var(--fg)}
.iconbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;width:34px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none}

/* Karte */
#board{grid-area:board;position:relative;min-height:0;overflow:hidden;background:var(--bg)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.gridline{stroke:var(--grid);stroke-width:1}
.rlabel{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.3em;fill:var(--line);text-anchor:middle}
.rlabel.off{opacity:.35}
.edge{stroke:var(--edge);stroke-width:3;stroke-linecap:round}
.edge.off{stroke:var(--line);stroke-width:1.5;opacity:.5}
.edge.own{stroke-width:3.5;opacity:.95}
.ecost circle{fill:var(--panel);stroke:var(--edge);stroke-width:1.2}
.ecost text{font-family:var(--display);font-size:11px;font-weight:600;fill:var(--muted);text-anchor:middle}
.city .halo{fill:transparent}
.city .body{fill:var(--panel-2);stroke-width:3}
.city .cname{font-family:var(--body);font-weight:600;font-size:11px;fill:var(--fg);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.city .sl{stroke-width:1.2}
.city .sl.open{fill:var(--bg);stroke:var(--muted)}
.city .sl.lock{fill:none;stroke:var(--line)}
.city.off circle{fill:var(--line)}
.city.off text{font-size:10px;fill:var(--muted);opacity:.5;text-anchor:middle}
.city.can{cursor:pointer}
.city.can .body{fill:#22303a}
.city.sel .halo{fill:none;stroke:var(--accent);stroke-width:2.5}
.cost rect{fill:var(--accent)}
.cost text{font-family:var(--display);font-weight:700;font-size:11px;fill:var(--accent-ink);text-anchor:middle}
.city.sel .cost rect{fill:var(--fg)}
.mapctl{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:20px;cursor:pointer;display:grid;place-items:center}
.regions-tag{position:absolute;right:10px;top:8px;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:3px 6px;border-radius:4px}

/* Bedienpult */
#panel{grid-area:panel;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
@media (orientation:portrait){#panel{border-left:0;border-top:1px solid var(--line)}}
.turn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.turn .dot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none}
.turn.wait .dot{animation:pulse 1s ease-in-out infinite}
.turn.me{color:var(--accent)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.turn.wait .dot{animation:none}}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.cards{display:flex;gap:6px;flex-wrap:wrap}

.plant{--t:var(--line);position:relative;width:58px;height:76px;border-radius:7px;background:color-mix(in srgb,var(--t) 32%,var(--panel-2));border:1px solid color-mix(in srgb,var(--t) 70%,var(--panel-2));display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;text-align:left;flex:none}
button.plant{cursor:pointer}
.plant .pn{font-family:var(--display);font-size:25px;line-height:.95;font-weight:700}
.plant .pr{display:flex;gap:2px;flex-wrap:wrap;min-height:10px}
.plant .pc{font-family:var(--display);font-size:16px;font-weight:600;display:flex;align-items:center;gap:3px;justify-content:flex-end;line-height:1}
.plant .ico{width:11px;height:11px}
.plant.sm{width:52px;height:66px}
.plant.sm .pn{font-size:21px}
.plant.sel{outline:2px solid var(--accent);outline-offset:2px}
.plant[disabled]{opacity:.35;cursor:default}
.plant.off{opacity:.4}
.plant.on{outline:2px solid var(--good);outline-offset:2px}
.plant.empty{border-style:dashed;background:transparent;border-color:var(--line)}
.plant.step3{--t:var(--accent);align-items:center;justify-content:center}
.plant.step3 .pl{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.t-coal{--t:var(--coal)} .t-oil{--t:var(--oil)} .t-garbage{--t:var(--garbage)} .t-uranium{--t:var(--uranium)} .t-eco{--t:var(--eco)}
.t-hybrid{--t:var(--coal);background:linear-gradient(135deg,color-mix(in srgb,var(--coal) 32%,var(--panel-2)) 50%,color-mix(in srgb,var(--oil) 40%,var(--panel-2)) 50%)}
.mkt-label{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

.res{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--rc);flex:none}
.r-coal{--rc:var(--coal)} .r-oil{--rc:var(--oil);border-radius:50%;box-shadow:inset 0 0 0 1px #8f99a5} .r-garbage{--rc:var(--garbage);border-radius:3px} .r-uranium{--rc:var(--uranium);border-radius:50%}
.r-hybrid{background:linear-gradient(135deg,var(--coal) 50%,var(--oil) 50%)}

.bidbox{display:flex;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.bidbox .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bidbox .who{font-size:12px;color:var(--muted)}
.bidders{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bidders span{font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--pc);color:var(--fg)}
.bidders span.out{opacity:.3;text-decoration:line-through}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.grow{flex:1}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:38px;height:40px;background:var(--panel-2);border:0;font-size:18px;cursor:pointer}
.stepper button[disabled]{opacity:.35}
.stepper output{min-width:58px;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}

.rres{display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.rres.na{opacity:.55}
.rhead{display:flex;align-items:center;gap:6px;font-weight:600}
.rhead .meta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.track{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.track.u{grid-template-columns:repeat(12,minmax(0,1fr))}
.pg{display:flex;flex-direction:column;align-items:center;gap:2px}
.pg span{font-family:var(--display);font-size:10px;color:var(--muted);line-height:1}
.slots{display:flex;gap:2px}
.sl{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--line)}
.sl.res{width:7px;height:7px}
.sl.cart{outline:1.5px solid var(--accent);outline-offset:1px}
.rctl{display:flex;align-items:center;gap:8px}
.rctl .mini{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:17px;cursor:pointer}
.rctl .mini[disabled]{opacity:.3}
.rctl output{font-family:var(--display);font-size:18px;font-weight:600;min-width:18px;text-align:center}

/* Overlays */

#start{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:flex;align-items:center;justify-content:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---- v2: Karten, Rohstoffe, Tracker ---- */

.chips{align-items:center}

@keyframes chipPulse{50%{box-shadow:0 0 0 1px var(--pc) inset,0 0 10px -2px var(--pc)}}

.tracker{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:10px;display:flex;align-items:center;gap:12px;padding:6px 10px 16px 12px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;z-index:2}

.tick{position:absolute;top:6px;width:1px;height:7px;background:var(--edge);transform:translateX(-.5px)}

.mark{position:absolute;top:-1px;width:2px;height:21px;background:var(--accent);transform:translateX(-1px);opacity:.8}

.tok{position:absolute;top:3px;left:0;width:13px;height:13px;border-radius:50%;background:var(--pc);border:2px solid var(--panel);transform:translate(-50%,calc(var(--o,0) * var(--tko,-7px)));transition:left .7s cubic-bezier(.3,.7,.2,1),transform .3s;z-index:1}

@media (prefers-reduced-motion:reduce){.float,.city .sl.fresh,.city .ring,.big.pop,.plant.inauc,.chip.act,.ticker p.new{animation:none}.float{display:none}.tok,.tk-fill{transition:none}}

.cards{padding-top:4px}

function supply(r){return TOT[r]-S.resMarket[r]-S.players.reduce((s,p)=>s+p.pool[r],0)}
function caps(p){const c={coal:0,oil:0,garbage:0,uranium:0,hybrid:0,gohybrid:0};p.plants.forEach(n=>{const[t,k]=PLANTS[n];if(!FREE(t))c[t]+=2*k});return c}
function canHold(p,pool){const c=caps(p);if(pool.uranium>c.uranium)return false;const ec=Math.max(0,pool.coal-c.coal),eg=Math.max(0,pool.garbage-c.garbage),eo=Math.max(0,pool.oil-c.oil);if(ec>c.hybrid||eg>c.gohybrid)return false;return eo<=(c.hybrid-ec)+(c.gohybrid-eg)}
function clampPool(p){let g=0;while(!canHold(p,p.pool)&&g++<300){const c=caps(p),q=p.pool;const ec=q.coal-c.coal,eg=q.garbage-c.garbage,eo=q.oil-c.oil;if(q.uranium>c.uranium)q.uranium--;else if(ec>c.hybrid)q.coal--;else if(eg>c.gohybrid)q.garbage--;else if(eo>0&&q.oil>0)q.oil--;else if(ec>0&&q.coal>0)q.coal--;else if(eg>0&&q.garbage>0)q.garbage--;else break}}
function citiesConnected(set){const act=new Set(CITIES.filter(c=>set.includes(c[2])).map(c=>c[0]));const st=[...act][0],seen=new Set([st]),q=[st];while(q.length){const u=q.shift();for(const{to}of ADJ[u])if(act.has(to)&&!seen.has(to)){seen.add(to);q.push(to)}}return seen.size===act.size}
function pickRegions(n){const keys=Object.keys(REGIONS);const must=MAPS[MAPID].mustRegion;let set;for(let tries=0;tries<200;tries++){set=[must&&REGIONS[must]?must:keys[rnd(keys.length)]];while(set.length<n){const fr=[...new Set(set.flatMap(r=>[...RADJ[r]]))].filter(r=>!set.includes(r));set.push(fr[rnd(fr.length)])}if(citiesConnected(set))break}return set}

function newStats(){return{start:Date.now(),partial:false,series:[],step2:null,step3:null,pl:S.players.map(()=>({auc:[],res:{coal:[0,0],oil:[0,0],garbage:[0,0],uranium:[0,0]},slot:0,conn:0,built:[],income:0,maxInc:0}))}}
function st(){if(!S.stats){S.stats=newStats();S.stats.partial=true}return S.stats}
function newGame(name,nAI,diff,regions,mapId,opts={}){
  loadMap(mapId||MAPID);const MP=MAPS[MAPID];
  const n=nAI+1;
  const names=['Rheinstrom AG','Ostwatt','Südnetz','Nordlicht Energie','Westfalen Volt'];
  const cols=['#4f9dff','#ff5fa2','#b48cff','#4fd6c4','#ff9f43','#c6e05a'];
  const RN=applyRulesN(n);
  const players=[];
  for(let i=0;i<n;i++)players.push({id:i,name:i===0?(name||'Du'):names[i-1],color:cols[i],human:i===0,money:50,plants:[],cities:[],pool:{coal:0,oil:0,garbage:0,uranium:0},done:false,lastPowered:0});
  const deckId=MAPS[MAPID].deluxe?'d2':(DECKS[opts.deck]?opts.deck:'std');const keys=deckKeys(deckId);loadDeck(keys);
  const isMix=deckId==='mix'||deckId==='mix1';
  const DR=DECK_RULES[isMix?'std':deckId];
  let deck,market;
  const all=keys.slice().sort((a,b)=>a-b);
  if(MP.deluxe){
    const dark=shuffle(all.filter(k=>Math.floor(k)<=15)),light=shuffle(all.filter(k=>Math.floor(k)>15));
    market=dark.splice(0,MP.mktSize).sort((a,b)=>a-b);
    const aside=MP.setAside?dark.shift():null;
    const rem={3:[2,6],4:[1,3]}[n]||[0,0];dark.splice(0,rem[0]);light.splice(0,rem[1]);
    deck=shuffle([...dark,...light]);if(aside!=null)deck.unshift(aside);deck.push(STEP3);
  }else if(MP.paris&&!isMix){
    const plugs=shuffle(all.filter(k=>k<=DR.lastPlug&&k!==DR.frRemove&&k!==DR.frMarket));
    market=[DR.frMarket,...plugs.splice(0,7)].sort((a,b)=>a-b);
    plugs.splice(0,n===3?1:0);
    const sock=shuffle(all.filter(k=>k>DR.lastPlug));sock.splice(0,{3:6,4:3}[n]||0);
    const top=plugs.shift();deck=[top,...shuffle([...plugs,...sock]),STEP3];
  }else{
    market=all.slice(0,8);
    const topKey=isMix?(keys.find(k=>Math.floor(k)===13&&PLANTS[k][0]==='eco')??keys.filter(k=>PLANTS[k][0]==='eco').sort((a,b)=>a-b)[0]):DR.top;
    const rest=shuffle(all.slice(8).filter(k=>k!==topKey));
    rest.splice(0,RN.remove);
    deck=[topKey,...rest];
    if(deckId==='mix'){deck.splice(Math.min(deck.length,34),0,STEP3)}else deck.push(STEP3);
  }
  const phaseSet=keys.filter(k=>[39,38.1,37.2].includes(k));
  S={v:1,n,players,deck,market,deckId,deckKeys:keys,phaseSet,step3Early:!!opts.step3Early,map:MAPID,noUranium:false,phaseOut:!!(MP.phaseOut39||(MP.phaseOutOpt&&opts.phaseOut)),resMarket:{...MP.start},owners:{},regions:(regions&&regions.length===RN.regions)?regions.slice():pickRegions(RN.regions),ai:diff||'normal',
     round:1,step:1,phase:null,order:shuffle(players.map(p=>p.id)),log:[],step3Pending:false,endTriggered:false,turnBuilt:[],auc:null,discard:null,seq:[],seqIdx:0,boughtAny:false,ranking:null};
  S.stats=newStats();
  log('Karte: '+MP.name+'.');
  log('Neues Spiel. Netzgebiet: '+S.regions.map(r=>REGIONS[r].name).join(', ')+'. KI-Stärke: '+AI_NAME[S.ai]+'.');
  startAuctionPhase();
}

function determineOrder(){S.order=S.players.map(p=>p.id).sort((a,b)=>{const A=P(a),B=P(b);return B.cities.length-A.cities.length||Math.max(0,...B.plants)-Math.max(0,...A.plants)})}
function buyable(){return S.step===3?S.market.slice():S.market.slice(0,4)}
function drawToMarket(){
  if(!S.deck.length)return;
  const c=S.deck.shift();
  if(c===STEP3){
    if(S.phase==='auction'){S.step3Pending=true;log('Die Stufe-3-Karte ist aufgetaucht. Nach der Versteigerung beginnt Stufe 3.')}
    else startStep3();
    return;
  }
  S.market.push(c);S.market.sort((a,b)=>a-b);
}
function startStep3(){
  S.step=3;S.step3Pending=false;st().step3=S.round;
  S.deck=shuffle(S.deck.filter(x=>x!==STEP3));
  const low=S.market.shift();while(S.market.length>6)S.market.shift();
  log('Stufe 3 beginnt. Kraftwerk '+PN(low)+' fällt weg, alle sechs Marktkraftwerke sind kaufbar.');
  let g=0;while(S.market.length<6&&S.deck.length&&g++<10)drawToMarket();
}
function removeLowCities(){
  let g=0;
  while(S.market.length&&S.market[0]<=maxCities()&&g++<40){const x=S.market.shift();if(x===S.discount)S.discount=null;log('Kraftwerk '+PN(x)+' ist veraltet und fällt aus dem Markt.');drawToMarket()}
}

/* --- Versteigerung --- */
function minBid(n){return S.phase==='auction'&&S.discount===n?1:Math.floor(n)}
function startAuctionPhase(){S.phase='auction';S.players.forEach(p=>p.done=false);S.boughtAny=false;S.discard=null;S.discount=MAPS[S.map].noDiscount?null:(S.market[0]??null);if(S.discount!=null)log('Rabatt: Das kleinste Kraftwerk '+PN(S.discount)+' ist diese Runde ab 1 € zu haben.');nextChooser()}
function nextChooser(){
  const next=S.order.find(id=>!P(id).done);
  if(next===undefined)return endAuctionPhase();
  S.auc={mode:'choose',chooser:next};
}
function doPass(pid){P(pid).done=true;log(P(pid).name+' verzichtet auf ein Kraftwerk.',pid);nextChooser()}
function doOpen(pid,num,bid){
  const bidders=[],idx=S.order.indexOf(pid);
  for(let k=1;k<=S.order.length;k++){const id=S.order[(idx+k)%S.order.length];if(!P(id).done)bidders.push(id)}
  S.auc={mode:'bid',chooser:pid,plant:num,bid,high:pid,bidders,all:bidders.slice(),turn:0};
  log(P(pid).name+' bietet '+bid+' € auf Kraftwerk '+PN(num)+'.',pid);
  if(bidders.length===1)award(pid);
}
function bidRaise(pid,amt){const a=S.auc;a.bid=amt;a.high=pid;log(P(pid).name+' erhöht auf '+amt+' €.',pid);a.turn=(a.turn+1)%a.bidders.length;if(a.bidders[a.turn]===a.high)a.turn=(a.turn+1)%a.bidders.length}
function bidDrop(pid){
  const a=S.auc;const i=a.bidders.indexOf(pid);a.bidders.splice(i,1);log(P(pid).name+' steigt aus.',pid);
  if(a.bidders.length===1)return award(a.bidders[0]);
  if(a.turn>=a.bidders.length)a.turn=0;
  if(a.bidders[a.turn]===a.high)a.turn=(a.turn+1)%a.bidders.length;
}
function award(pid){
  const a=S.auc,p=P(pid);
  p.money-=a.bid;p.plants.push(a.plant);p.plants.sort((x,y)=>x-y);
  if(S.phaseOut&&(S.phaseSet||[39]).includes(a.plant)&&!S.noUranium){S.noUranium=true;log('Atomausstieg: Kraftwerk '+PN(a.plant)+' ist gekauft. Ab jetzt wird kein Uran mehr nachgefüllt.')}
  st().pl[pid].auc.push({n:a.plant,price:a.bid,min:a.plant===S.discount?1:a.plant,r:S.round,disc:a.plant===S.discount});
  S.market=S.market.filter(x=>x!==a.plant);p.done=true;S.boughtAny=true;if(a.plant===S.discount)S.discount=null;
  log(p.name+' kauft Kraftwerk '+PN(a.plant)+' für '+a.bid+' €.',pid);
  drawToMarket();removeLowCities();
  if(p.plants.length>3){S.discard=pid;S.newPlant=a.plant;S.auc={mode:'wait'};return}
  nextChooser();
}
function discardPlant(pid,num){
  const p=P(pid);if(num===S.newPlant&&p.plants.length>3){const old=p.plants.filter(x=>x!==S.newPlant);num=old.sort((a,b)=>PLANTS[a][2]-PLANTS[b][2]||a-b)[0]}
  p.plants=p.plants.filter(x=>x!==num);clampPool(p);
  log(p.name+' legt Kraftwerk '+PN(num)+' still.',pid);S.discard=null;S.newPlant=null;nextChooser();
}
function endAuctionPhase(){
  if(S.discount!=null&&S.market.includes(S.discount)){const x=S.discount;S.market=S.market.filter(y=>y!==x);log('Das Rabatt-Kraftwerk '+PN(x)+' wurde nicht gekauft und fällt weg.');drawToMarket();removeLowCities()}
  S.discount=null;
  if(MAPS[S.map].allPassRemove&&!S.boughtAny&&S.round>1&&S.market.length){const x=S.market.shift();log('Niemand hat ein Kraftwerk gekauft. Kraftwerk '+PN(x)+' fällt weg.');drawToMarket();removeLowCities()}
  if(S.step3Pending)startStep3();
  if(S.round===1&&!MAPS[S.map].keepR1Order)determineOrder();
  startResources();
}

/* --- Rohstoffe & Bauen --- */
function startResources(){S.phase='resources';S.seq=[...S.order].reverse();S.seqIdx=0}
function startBuild(){S.phase='build';S.seq=[...S.order].reverse();S.seqIdx=0;S.turnBuilt=[]}
function nextSeq(){
  S.seqIdx++;S.turnBuilt=[];
  if(S.seqIdx>=S.seq.length){if(S.phase==='resources')startBuild();else endBuild()}
}
function buyResources(pid,cart){
  const p=P(pid);let total=0;const parts=[];
  RES.forEach(r=>{const k=cart[r];if(!k)return;const c=buyCost(r,k);total+=c;const sr=st().pl[pid].res[r];sr[0]+=k;sr[1]+=c;S.resMarket[r]-=k;p.pool[r]+=k;parts.push(k+' '+RNAME[r])});
  p.money-=total;
  log(parts.length?p.name+' kauft '+parts.join(', ')+' für '+total+' €.':p.name+' kauft keine Rohstoffe.',pid);
}
function distFrom(p){
  if(!p.cities.length)return null;
  const act=new Set(activeIds()),d={},done=new Set();
  act.forEach(c=>d[c]=Infinity);p.cities.forEach(c=>d[c]=0);
  for(;;){let u=null,b=Infinity;for(const c of act)if(!done.has(c)&&d[c]<b){b=d[c];u=c}if(u===null)break;done.add(u);for(const{to,cost}of ADJ[u]){if(act.has(to)&&d[u]+cost<d[to])d[to]=d[u]+cost}}
  return d;
}
function buildOptions(p){
  const d=distFrom(p),out=[];
  for(const c of activeIds()){
    const occ=S.owners[c]||[];
    if(occ.includes(p.id)||occ.length>=S.step)continue;
    const conn=d?d[c]:0;if(conn===Infinity)continue;
    out.push({city:c,slot:SLOT_COST[occ.length],conn,cost:SLOT_COST[occ.length]+conn});
  }
  return out.sort((a,b)=>a.cost-b.cost);
}
function doBuild(pid,city){
  const p=P(pid);const o=buildOptions(p).find(x=>x.city===city);
  if(!o||o.cost>p.money)return false;
  p.money-=o.cost;p.cities.push(city);(S.owners[city]??=[]).push(pid);S.turnBuilt.push({city,cost:o.cost,slot:o.slot,conn:o.conn});
  const sp=st().pl[pid];sp.slot+=o.slot;sp.conn+=o.conn;sp.built.push(city);
  log(p.name+' baut in '+CITY[city].name+' ('+o.cost+' €).',pid);
  return true;
}
function undoBuilds(pid){
  const p=P(pid);
  S.turnBuilt.forEach(({city,cost,slot,conn})=>{const sp=st().pl[pid];sp.slot-=slot||0;sp.conn-=conn||0;const bi=sp.built.lastIndexOf(city);if(bi>=0)sp.built.splice(bi,1);p.money+=cost;p.cities=p.cities.filter(c=>c!==city);S.owners[city]=S.owners[city].filter(x=>x!==pid)});
  if(S.turnBuilt.length)log(p.name+' nimmt den Ausbau zurück.',pid);
  S.turnBuilt=[];
}
function endBuild(){
  const m=maxCities();
  if(S.step===1&&m>=STEP2_AT){S.step=2;st().step2=S.round;const x=S.market.shift();log('Stufe 2 beginnt: Jede Stadt bietet jetzt zwei Plätze. Kraftwerk '+PN(x)+' fällt weg.');if(!MAPS[S.map].step2NoReplace)drawToMarket()}
  removeLowCities();
  if(m>=END_AT&&!S.endTriggered){S.endTriggered=true;log('Ein Netz hat '+END_AT+' Städte erreicht. Dies ist die letzte Stromlieferung.')}
  startBureau();
}

/* --- Bürokratie --- */
function powerOptions(p,nums,pool=p.pool){
  const need={coal:0,oil:0,garbage:0,uranium:0};let h1=0,h2=0,cities=0;
  for(const n of nums){const[t,k,c]=PLANTS[n];cities+=c;if(FREE(t))continue;if(t==='hybrid')h1+=k;else if(t==='gohybrid')h2+=k;else need[t]+=k}
  if(need.coal>pool.coal||need.oil>pool.oil||need.garbage>pool.garbage||need.uranium>pool.uranium)return null;
  const lc=pool.coal-need.coal,lo=pool.oil-need.oil,lg=pool.garbage-need.garbage;
  const uc=Math.min(h1,lc),ug=Math.min(h2,lg),uo=(h1-uc)+(h2-ug);if(uo>lo)return null;
  const use={...need};use.coal+=uc;use.garbage+=ug;use.oil+=uo;
  return{use,cities,powered:Math.min(cities,p.cities.length)};
}
function bestPower(p){
  let best={nums:[],powered:0,used:0};const pl=p.plants;
  for(let m=1;m<(1<<pl.length);m++){
    const nums=pl.filter((_,i)=>m&(1<<i));const o=powerOptions(p,nums);if(!o)continue;
    const used=RES.reduce((s,r)=>s+o.use[r],0);
    if(o.powered>best.powered||(o.powered===best.powered&&used<best.used))best={nums,powered:o.powered,used};
  }
  return best.nums;
}
function payout(p,use,powered,nums=[]){
  RES.forEach(r=>p.pool[r]-=use[r]);
  {const sp=st().pl[p.id];sp.burn=sp.burn||{coal:0,oil:0,garbage:0,uranium:0};RES.forEach(r=>sp.burn[r]+=use[r]);sp.powT=sp.powT||{};let left=powered;nums.slice().sort((a,b)=>PLANTS[b][2]-PLANTS[a][2]).forEach(n=>{const c=Math.min(left,PLANTS[n][2]);if(c>0){const t=PLANTS[n][0];sp.powT[t]=(sp.powT[t]||0)+c;left-=c}})}
  const inc=PAY[Math.min(powered,20)];p.money+=inc;p.lastPowered=powered;const sp=st().pl[p.id];sp.income+=inc;sp.maxInc=Math.max(sp.maxInc,inc);
  log(p.name+' versorgt '+powered+(powered===1?' Stadt':' Städte')+' und verdient '+inc+' €.',p.id);
}
function applyPower(p,nums){
  const o=powerOptions(p,nums)||{use:{coal:0,oil:0,garbage:0,uranium:0},powered:0};
  payout(p,o.use,o.powered,nums);
}
function startBureau(){
  S.phase='bureau';S.bureauDone=false;
  S.players.filter(p=>!p.human).forEach(p=>applyPower(p,bestPower(p)));
  if(!S.players.some(p=>p.human))finishBureau();
}
function finishBureau(){
  st().series.push({r:S.round,m:S.players.map(p=>p.money),c:S.players.map(p=>p.cities.length),p:S.players.map(p=>p.lastPowered)});
  if(S.endTriggered)return endGame();
  RES.forEach(r=>{const add=(r==='uranium'&&S.noUranium)?0:Math.min(RSUP(r),supply(r),CAP[r]-S.resMarket[r]);S.resMarket[r]+=add});
  if(S.step===3){const x=S.market.shift();if(x!=null)S.deck.push(x);drawToMarket()}
  else{const hi=S.market.pop();if(hi!=null)S.deck.push(hi);drawToMarket()}
  removeLowCities();
  S.round++;determineOrder();startAuctionPhase();
}
function endGame(){
  S.phase='end';
  S.ranking=S.players.map(p=>p.id).sort((a,b)=>P(b).lastPowered-P(a).lastPowered||P(b).money-P(a).money||P(b).cities.length-P(a).cities.length);
  log(P(S.ranking[0]).name+' gewinnt mit '+P(S.ranking[0]).lastPowered+' versorgten Städten.',S.ranking[0]);
  st().end=Date.now();if(typeof onGameEnd==='function')onGameEnd();
}

/* --- KI --- */
const AI_LV={easy:{mul:.85,res:20,pass:.3,extra:0,stock:false,guard:false,max2:true},normal:{mul:1,res:15,pass:0,extra:0,stock:false,guard:false},hard:{mul:1,res:15,pass:0,extra:0,stock:true,guard:false,over:4,endgame:true},expert:{mul:1,res:20,pass:0,extra:0,stock:false,guard:false,over:1,endgame:true}};
const AI_NAME={easy:'Leicht',normal:'Normal',hard:'Schwer',expert:'Experte'};
const AI_NOTE={easy:'Baut langsam und lässt sich oft Kraftwerke wegschnappen.',normal:'Solide Grundstrategie, bietet bei Kraftwerken gern zu viel.',hard:'Bietet maßvoll, deckt sich mit günstigen Rohstoffen ein und plant das Spielende.',expert:'Lässt sich kaum hochbieten, spart für den Netzausbau und beendet das Spiel nur, wenn sie dabei gewinnt.'};
function AIK(p){return (p&&p.ai)||S.ai||'normal'}
function L(p){return AI_LV[AIK(p)]||AI_LV.normal}
function aiPlantValue(p,num){
  const[t,k,c]=PLANTS[num];const cur=capacity(p);
  let after;
  if(p.plants.length<3)after=cur+c;
  else{const worst=Math.min(...p.plants.map(n=>PLANTS[n][2]));after=cur-worst+c}
  const gain=after-cur;if(gain<=0)return -1;
  let v=num+gain*4+(FREE(t)?6:0)+(k===1&&!FREE(t)?2:0)+(c>=5?4:0)+(S.step===1&&p.plants.length===0?3:0);
  if(L(p).eff)v+=Math.round((FREE(t)?3:c/k)*2);
  if(t==='uranium'&&S.phaseOut){
    if(S.noUranium){const left=S.resMarket.uranium+p.pool.uranium;v=left>=2*k?Math.round(v*0.45):-1}
    else v=Math.round(v*(S.step===1?0.9:0.75));
  }
  if(v<0)return -1;v=Math.round(v*L(p).mul);if(L(p).over!=null)v=Math.min(v,num+L(p).over+(p.plants.length<3&&S.step===1&&p.plants.length===0?4:0));return v;
}
function aiReserve(p){return S.round===1?8:L(p).res}
function aiChoose(p){
  let best=null,bs=-1e9;
  for(const num of buyable()){
    const v=aiPlantValue(p,num);if(v<0)continue;
    const maxb=Math.min(v,p.money-aiReserve(p));if(maxb<minBid(num))continue;
    const s=v-minBid(num)+PLANTS[num][2]*3;if(s>bs){bs=s;best=num}
  }
  if(S.round>1&&Math.random()<L(p).pass)return doPass(p.id);
  if(S.round>1){
    const spare=capacity(p)-p.cities.length;
    if(!best||(spare>=3&&p.plants.length>=2&&bs<22)||(p.plants.length===3&&bs<12))return doPass(p.id);
  }
  if(!best){const c=buyable().filter(n=>minBid(n)<=p.money);if(!c.length)return doPass(p.id);best=c[0]}
  doOpen(p.id,best,minBid(best));
}
function aiBid(p){
  const a=S.auc;const v=aiPlantValue(p,a.plant);let maxb=Math.min(v,p.money-aiReserve(p));
  if(L(p).outbid&&P(a.high).human&&v>0)maxb=Math.min(Math.round(v*1.1),p.money-aiReserve(p));
  if(a.bid+1<=maxb)bidRaise(p.id,a.bid+1);else bidDrop(p.id);
}
function aiDiscard(p){
  const worst=p.plants.filter(x=>x!==S.newPlant).sort((a,b)=>PLANTS[a][2]-PLANTS[b][2]||a-b)[0];discardPlant(p.id,worst);
}
function aiBuy(p){
  const plants=[...p.plants].sort((a,b)=>PLANTS[b][2]-PLANTS[a][2]);
  const avail={...p.pool},buy={coal:0,oil:0,garbage:0,uranium:0};let mk={...S.resMarket},spent=0,powered=0;
  const cityCount=p.cities.length,cap=capacity(p);
  let reserve=Math.max(0,Math.min(cap,cityCount+3)-cityCount)*16;
  const lvb=L(p);let fuelTo=cityCount;

(function mapGestures(){

function normAlloc(p){

  for(const[n,arr]of Object.entries(prev)){const pl=al[n];if(!pl)continue;const[t,k]=PLANTS[n];for(const r of arr)if(fitsType(t,r)&&pl.length<2*k)pl.push(r)}

function allocPower(p,nums){

}

function regionsAdjacent(sel){const set=new Set(sel),seen=new Set([sel[0]]),q=[sel[0]];while(q.length){const r=q.shift();for(const x of RADJ[r]||[])if(set.has(x)&&!seen.has(x)){seen.add(x);q.push(x)}}return seen.size===sel.length}
function regionsValid(sel,n){

  while(q.length){const r=q.shift();for(const x of RADJ[r])if(set.has(x)&&!seen.has(x)){seen.add(x);q.push(x)}}
  return seen.size===n&&citiesConnected(sel);
}

const TCACHE=new Map();
function tr(t){
  if(LANG!=='en'||!t||!/[A-Za-zÄÖÜäöüß]/.test(t))return t;
  if(TCACHE.has(t))return TCACHE.get(t);
  let o=t;
  for(const[re,r]of TSR)o=o.replace(re,r);
  for(const[re,r]of TP)o=o.replace(re,r);
  for(const[re,r]of TSR2)o=o.replace(re,r);
  for(const[re,r]of TWR)o=o.replace(re,r);
  o=o.replace(/^You (passes|bids|raises|drops|buys|retires|builds|undoes|does|powers|wins)\b/u,(m,v)=>'You '+({passes:'pass',does:'do',undoes:'undo'}[v]||v.replace(/s$/,''))).replace(/^You (.+) and earns /u,'You $1 and earn ').replace(/^You (.+) and earns /u,'You $1 and earn ').replace(/^You is /u,'You are ').replace(/^You (\w+)s\b(?= )/u,(m,v)=>['wins','buys'].includes(v+'s')?'You '+v:m);

  const els=[n,...n.querySelectorAll('[aria-label],[title]')];
  for(const el of els)for(const a of TATTR){const v=el.getAttribute&&el.getAttribute(a);if(v){const o=tr(v);if(o!==v){const m=ORIGA.get(el)||{};if(!(a in m))m[a]=v;ORIGA.set(el,m);el.setAttribute(a,o)}}}

const B62='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function b62e(bytes){let n=1n;for(const b of bytes)n=(n<<8n)|BigInt(b);let s='';while(n>0n){s=B62[Number(n%62n)]+s;n/=62n}return s}

  stats:()=>{UI.statReset=false;UI.statView='total';UI.sheet=null;renderSheet();renderStats();$('#stats').scrollTop=0;return'skip'},
  statsBack:()=>{$('#stats').hidden=true;$('#stats').innerHTML='';if(!$('#start').hidden)renderStart(true);return'skip'},
  statsSel:b=>{UI.statSel=b.dataset.id;UI.statView='game';const h=filtHist();if(!h.some(g=>g.id===UI.statSel)){UI.statDiff='all';UI.statMap='all'}renderStats();$('#stats').scrollTop=0;return'skip'},
  statsNav:b=>{const h=filtHist();const i=h.findIndex(g=>g.id===UI.statSel);const j=Math.max(0,Math.min(h.length-1,(i<0?h.length-1:i)+ +b.dataset.d));UI.statSel=h[j].id;UI.statView='game';renderStats();return'skip'},
  statsReset:()=>{UI.statReset=true;renderStats();return'skip'},
  statsResetNo:()=>{UI.statReset=false;renderStats();return'skip'},
  statsResetYes:()=>{saveHist([]);try{localStorage.removeItem(STATS_KEY)}catch(_){}UI.statReset=false;renderStats();return'skip'},
  menu:()=>UI.sheet='menu',close:()=>{UI.sheet=UI.back||null;UI.back=null},opp:()=>{UI.sheet=UI.sheet==='opp'&&isDock()?null:'opp'},oppjump:b=>{const el=document.getElementById('opp-'+b.dataset.pid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return'skip'},log:()=>UI.sheet='log',rules:()=>UI.sheet='rules',
  results:()=>UI.sheet='results',newgame:()=>UI.sheet='newgame',
  newyes:()=>{UI.sheet=null;clearTimeout(timer);renderSheet();renderStart(true);return'skip'},
  startrules:()=>{UI.sheet='rules';renderStart(false);return'rules'},
  nai:b=>{UI.nAI=+b.dataset.n;if(UI.regions.length&&UI.regions.length!==regionCount(UI.nAI+1))UI.regions=[];UI.name=$('#nm').value;renderStart(true);return'skip'},
  diff:b=>{UI.diff=b.dataset.d;UI.name=$('#nm').value;renderStart(true);return'skip'},
  reg:b=>{const r=b.dataset.r;UI.regions=UI.regions.includes(r)?UI.regions.filter(x=>x!==r):[...UI.regions,r];UI.name=$('#nm').value;renderStart(true);return'skip'},
  regrand:()=>{UI.regions=[];UI.name=$('#nm').value;renderStart(true);return'skip'},
  markets:()=>{UI.sheet=UI.sheet==='markets'&&isDock()?null:'markets'},
  pinfo:b=>{UI.back=isDock()?UI.sheet:null;UI.pnum=+b.dataset.num;UI.sheet='plant'},
  start:()=>{if(!regionsOk())return'skip';UI.name=$('#nm').value.trim();newGame(UI.name||(LANG==='en'?'You':'Du'),UI.nAI,UI.diff,regionsOk()&&UI.regions.length?UI.regions:null,UI.map||'de',{phaseOut:UI.deAtom!==false,deck:UI.deck||'std'});UI.prevMoney=null;UI.prevOwners=null;$('#tracker').dataset.k='';UI.vb=null;UI.sel=null;UI.buildSel=null;UI.powerKey='';UI.cartKey='';renderStart(false)},
  cont:()=>{loadMap(S.map||'de');loadDeck(S.deckKeys||deckKeys('std'));UI.vb=null;renderStart(false)},
  zin:()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.3);return'skip'},
  zout:()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.3);return'skip'},
  fit:()=>{fitMap();applyVB();return'skip'},
  pick:b=>{const n=+b.dataset.num;UI.sel=UI.sel===n?null:n;UI.bid=minBid(n)},
  bidm:()=>{UI.bid--},bidp:()=>{UI.bid++},
  open:()=>{if(!myTurn('choose'))return;doOpen(H,UI.sel,UI.bid);UI.sel=null},
  pass:()=>{if(!myTurn('choose'))return;doPass(H);UI.sel=null},
  raise:()=>{if(!myTurn('bid'))return;bidRaise(H,UI.bid)},
  drop:()=>{if(!myTurn('bid'))return;bidDrop(H)},
  dsel:b=>{const n=+b.dataset.num;if(n!==S.newPlant)UI.discSel=n},
  dopen:()=>{UI.sheet=null},
  dconfirm:()=>{if(!myTurn('discard')||UI.discSel==null)return;const n=UI.discSel;UI.discSel=null;discardPlant(H,n)},
  cartp:b=>{const n=+b.dataset.n,r=b.dataset.r;if(canAddP(n,r))addP(n,r)},
  cartm:b=>{const n=+b.dataset.n,r=b.dataset.r;const c=UI.pcart[n];if(c&&c[r]>0)c[r]--},
  suggest:()=>suggestCart(),
  realloc:()=>{const p=me();p.alloc=storageView(p);normAlloc(p);UI.powerKey='';UI.pcart={}},
  hyb:b=>{UI.hyb[+b.dataset.n]=b.dataset.r},
  buy:()=>{if(!myTurn('buy'))return;const tot=Z();RES.forEach(r=>tot[r]=cartTot(r));const p=me();normAlloc(p);buyResources(H,tot);for(const[n,c]of Object.entries(UI.pcart))RES.forEach(r=>{for(let i=0;i<(c[r]||0);i++)p.alloc[n].push(r)});UI.pcart={};nextSeq()},
  skipbuy:()=>{if(!myTurn('buy'))return;buyResources(H,{coal:0,oil:0,garbage:0,uranium:0});nextSeq()},
  bsel:b=>{UI.buildSel=b.dataset.city},
  build:()=>{if(!myTurn('build'))return;if(doBuild(H,UI.buildSel))UI.buildSel=null},
  breset:()=>{if(!myTurn('build'))return;undoBuilds(H)},
  bdone:()=>{if(!myTurn('build'))return;if(!S.turnBuilt.length)log(me().name+' baut nicht aus.',H);UI.buildSel=null;nextSeq()},
  ptoggle:b=>{const n=+b.dataset.num;UI.power=UI.power.includes(n)?UI.power.filter(x=>x!==n):[...UI.power,n]},
  power:()=>{if(S.phase!=='bureau')return;const p=me();const o=allocPower(p,UI.power);if(!o)return;for(const[n,got]of Object.entries(o.take))got.forEach(r=>{const a=p.alloc[n];a.splice(a.indexOf(r),1)});payout(p,o.use,o.powered,UI.power||[]);finishBureau();if(S.phase==='end')UI.sheet='results'},
};
function myTurn(kind){const a=actor();return a&&a.pid===H&&a.kind===kind}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled||b.hasAttribute('disabled'))return;
  const f=A[b.dataset.act];if(!f)return;
  const r=f(b);
  if(r==='skip')return;
  if(!S){renderSheet();if(!UI.sheet)renderStart(true);return}
  if(r==='rules'){renderSheet();return}
  after();
});
window.addEventListener('resize',()=>{if(S){applyVB();if(UI.sheet)renderSheet()}});

/* --- Start --- */
function boot(data){
  if(data&&data.S)S=data.S;
  else{try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===1)S=s}}catch(_){}}
  if(S){S.ai=S.ai||'normal';applyRulesN(S.n);loadMap(S.map||'de');loadDeck(S.deckKeys||deckKeys('std'));UI.prevOwners=JSON.parse(JSON.stringify(S.owners));render();if(data&&data.S){renderStart(false);schedule()}else renderStart(true)}
  else renderStart(true);
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(_){}
setTimeout(checkHashImport,0);
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
