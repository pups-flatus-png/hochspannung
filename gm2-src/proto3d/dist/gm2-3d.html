:root{--bg:#05080b;--panel:rgba(18,26,32,.86);--line:#26333d;--fg:#e3eaee;--muted:#8495a1;--accent:#f2b33d;--ink:#1d1405;--bad:#e0483d;--good:#58b86a;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 15px/1.3 Barlow,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lb.city{font:600 10px/1 Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(226,234,240,.86);padding:2px 3px;text-shadow:0 0 4px #000,0 0 10px rgba(0,0,0,.9),0 1px 1px #000}
.lb.city.own{color:#ffd88a}
.lb.city.hl{color:var(--ink);background:var(--accent);border-radius:4px;text-shadow:none;padding:3px 5px}
.lb.cost{font:800 8.5px/1 Orbitron,sans-serif;color:#b5c3cc;padding:3px 5px;border-radius:9px;background:rgba(6,10,13,.7);border:1px solid rgba(160,185,200,.22);backdrop-filter:blur(2px)}
.lb.cost.hl{color:var(--ink);background:var(--accent);border-color:var(--accent)}
.float{position:absolute;left:0;top:0;font:800 18px/1 Orbitron,sans-serif;text-shadow:0 2px 6px #000;pointer-events:none}
.float.neg{color:#ff8a7a}.float.sm{font-size:13px}.float.pos{color:var(--accent)}
.hud{position:fixed;left:0;right:0;display:flex;align-items:center;gap:8px;pointer-events:none;padding-left:calc(10px + var(--sl));padding-right:calc(10px + var(--sr))}
.hud>*{pointer-events:auto}
#top{top:0;padding-top:calc(8px + var(--st));justify-content:space-between}
.brand{min-width:0;flex:0 1 auto;display:flex;align-items:baseline;gap:6px;font:800 15px/1 Orbitron,sans-serif;letter-spacing:.08em;color:var(--accent);padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;overflow:hidden}
.brand span{overflow:hidden;text-overflow:ellipsis}
.brand small{font:700 10px/1 Barlow,sans-serif;color:var(--muted);letter-spacing:.12em;flex:none}
.money{flex:none;display:flex;align-items:baseline;gap:4px;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font:800 18px/1 Orbitron,sans-serif;color:var(--fg)}
.money i{font-style:normal;color:var(--accent);font-size:14px}
.money .dot{width:9px;height:9px;border-radius:50%;background:#f2b33d;box-shadow:0 0 8px #f2b33d;align-self:center;margin-right:3px}
#bot{bottom:0;padding-bottom:calc(10px + var(--sb));justify-content:center;gap:6px}
button{font:600 14px/1 Barlow,sans-serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:44px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
button:active{transform:scale(.97)}
button.gold{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.4}
#bot button{flex:0 1 auto}
#bPower{border-color:rgba(242,179,61,.6);color:var(--accent)}
#toast{position:fixed;left:50%;top:calc(64px + var(--st));transform:translate(-50%,-8px);max-width:min(92vw,420px);padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px;text-align:center;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#card{position:fixed;left:calc(10px + var(--sl));right:calc(10px + var(--sr));bottom:calc(66px + var(--sb));max-width:420px;margin:0 auto;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid rgba(242,179,61,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform:translateY(12px);opacity:0;pointer-events:none;transition:.22s}
#card.on{opacity:1;transform:none;pointer-events:auto}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#cName{flex:1;min-width:0;font:800 15px/1.1 Orbitron,sans-serif;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cX{min-height:34px;padding:6px 10px;flex:none}
.row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);padding:2px 0}
.row b{font:800 13px/1.4 Orbitron,sans-serif;color:var(--fg)}
.row.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;color:var(--fg)}
.row.tot b{color:var(--accent)}
.why{color:#ff8a7a;padding:4px 0}
#cBuild{width:100%;margin-top:10px}
.prow{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:6px 8px;margin:3px 0;border-radius:10px;text-align:left}.prow.on{border-color:var(--accent);background:#1f2a33}
.prow .pn{font:800 15px Orbitron,sans-serif;min-width:26px}.prow .pr{width:10px;height:10px;border-radius:3px;flex:none}.prow .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px}.prow .pm{color:var(--muted);font-size:12px}
.float.bid{font-size:20px;text-shadow:0 2px 8px #000,0 0 14px rgba(0,0,0,.8)}
.mrow{display:flex;align-items:center;gap:8px;padding:3px 0}.mrow .sw{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.mrow .nm{font-weight:600;min-width:52px}.mrow .sub{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .st{min-height:36px;min-width:40px;padding:0;font-size:18px;flex:none}.mrow .n{font:800 14px Orbitron,sans-serif;min-width:18px;text-align:center}
.coin{position:fixed;left:0;top:0;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c4,#f2b33d 45%,#a86f12);color:#5a3a06;font:800 13px/26px Orbitron,sans-serif;text-align:center;box-shadow:0 0 14px rgba(242,179,61,.9);pointer-events:none;z-index:20}
.money{transition:transform .25s,box-shadow .25s}.money.pop{transform:scale(1.12);box-shadow:0 0 24px rgba(242,179,61,.7)}
body.clean #top,body.clean #bot,body.clean #card,body.clean #toast{display:none!important}
#fps{position:fixed;right:calc(10px + var(--sr));top:calc(56px + var(--st));font:700 10px Orbitron;color:var(--muted)}
@media (max-width:430px){#bot button{padding:10px 9px;font-size:13px}}
@media (orientation:landscape) and (max-height:500px){
  #top{padding-top:calc(6px + var(--st))}
  .brand{padding:7px 10px;font-size:13px}.money{padding:6px 10px;font-size:16px}
  #bot{justify-content:flex-start;padding-bottom:calc(6px + var(--sb))}
  button{min-height:38px;padding:9px 12px;font-size:13px}
  #card{left:auto;right:calc(10px + var(--sr));bottom:auto;top:calc(52px + var(--st));width:270px;margin:0}
  #toast{top:calc(52px + var(--st))}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<header class="hud" id="top"><div class="brand"><span>GRID MASTER 2</span><small>3D</small></div><div class="money"><span class="dot"></span><b id="money">0</b><i>€</i></div></header>
<div id="toast"></div>
<div id="card"><div class="ch"><div id="cName"></div><button id="cX" aria-label="close">✕</button></div><div id="cRows"></div><button id="cBuild" class="gold"></button></div>
